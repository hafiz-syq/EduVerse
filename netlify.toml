# Konfigurasi Netlify untuk EduVerse.
# Lokal tetap pakai alur lama (npm run dev + npm run dev:api); berkas ini hanya dipakai
# saat situs di-build dan di-serve oleh Netlify.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # 24 = runtime default Netlify untuk situs baru, dan termasuk engines paket (>=24.0.0).
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  # pg di luar bundel: fungsi mengimpornya dari node_modules, sehingga opsional
  # require internal (pg-cloudflare) tidak membuat build gagal.
  external_node_modules = ["pg"]

  # node_version hanya berlaku per-glob (tabel, bukan string di [functions]);
  # menulisnya sebagai string ditolak CLI dengan "must be an object".
  [functions."*"]
    node_version = "24"

# Route aplikasi dipetakan eksplisit, bukan lewat /* -> /index.html. Dengan begini
# subtree /functions/v1/app/ milik Function tidak pernah bergantung pada urutan
# evaluasi rewrite terhadap path Function.
[[redirects]]
  from = "/materi"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/modul/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kuis"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/koding"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/diskusi"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/diskusi/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/arena"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/arena/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/profil"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/masuk"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kebijakan-privasi"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

# Aset bernama hash boleh disimpan lama; sw.js dan index.html tidak, supaya
# pembaruan luring tetap terdeteksi.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
