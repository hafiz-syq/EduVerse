<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F6FEB" />
    <meta
      name="description"
      content="EduVerse — belajar pemrograman gratis: materi terstruktur, kuis berbatas waktu, kolom diskusi, dan Uji Kompetensi untuk memperebutkan papan peringkat."
    />
    <meta name="clckd" content="db55e846a3de9bff6b00e9286c1467fa" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>EduVerse — Belajar Pemrograman Gratis</title>
    <!-- Clickadu: tag iklan dari dashboard publisher (Sites and Zones -> Get code). -->
    <script data-cfasync="false" type="text/javascript" src="//libedgolart.com/t/9/fret/mew4/1758705/brt.js"></script>
    <script>
      (function () {
        try {
          var tersimpan = localStorage.getItem("ev_theme");
          var gelap = tersimpan ? tersimpan === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", gelap);
        } catch (err) {
          document.documentElement.classList.toggle("dark", window.matchMedia("(prefers-color-scheme: dark)").matches);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >EduVerse perlu JavaScript aktif. Materi yang sudah Anda unduh dapat dibaca lewat mode
      luring setelah halaman ini dimuat sekali.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
